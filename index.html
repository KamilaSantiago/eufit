<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eufit - Início</title>
    <!-- Fonte delicada do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Variáveis de Cores */
        :root {
            --rosa-bebe-bg: #fff5f7;
            --rosa-bebe-card: #fdecf0;
            --vinho-principal: #6b2432;
            --vinho-hover: #501b25;
            --vinho-suave: rgba(107, 36, 50, 0.1);
            --texto-cor: #4a1521;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--rosa-bebe-bg);
            color: var(--texto-cor);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 30px;
            box-shadow: 0 10px 30px rgba(107, 36, 50, 0.05);
            border: 1px solid rgba(253, 236, 240, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 30px;
        }

        /* Títulos */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--vinho-principal);
            font-weight: 600;
            line-height: 1.2;
        }

        p.subtitulo {
            font-size: 1.1rem;
            color: var(--texto-cor);
            opacity: 0.85;
            max-width: 500px;
            font-weight: 300;
        }

        /* Container da Imagem com bordas arredondadas */
        .image-wrapper {
            width: 100%;
            max-width: 380px;
            height: 380px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(107, 36, 50, 0.12);
            border: 4px solid #ffffff;
            transition: transform 0.3s ease;
        }

        .image-wrapper:hover {
            transform: translateY(-5px);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Botão estilizado */
        .btn-iniciar {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--vinho-principal);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(107, 36, 50, 0.2);
            margin-top: 10px;
        }

        .btn-iniciar:hover {
            background-color: var(--vinho-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(107, 36, 50, 0.3);
        }

        /* Responsividade para celulares */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .image-wrapper {
                height: 280px;
            }
            .btn-iniciar {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <h1>eufit</h1>
            <p class="subtitulo">Seu shape tá ficando top :)</p>
        </header>

        <!-- ÁREA DA SUA IMAGEM -->
        <div class="image-wrapper">
            <img src="foto.jpeg" alt="Minha Foto eufit">
        </div>

        <!-- BOTÃO PARA SEGUNDA PÁGINA (INDEX.HTML) -->
        <a href="index.html" class="btn-iniciar">
            Iniciar construção do shape do dia
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
    </main>

</body>
</html>
